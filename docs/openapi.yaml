openapi: 3.0.0
info:
  title: AI-Marketplace API
  version: 1.0.0
  description: API for autonomous AI service generation and subscription management.
paths:
  /services:
    get:
      summary: List all AI services
      responses:
        '200':
          description: Successful response
  /billing/subscribe:
    post:
      summary: Create subscription
      responses:
        '200':
          description: Subscription created
  /billing/usage:
    post:
      summary: Report API usage
      responses:
        '200':
          description: Usage recorded
components:
  schemas:
    Service:
      type: object
      properties:
        id: {type: string}
        name: {type: string}