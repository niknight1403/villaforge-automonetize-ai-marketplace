openapi: 3.0.0
info:
  title: AI-Marketplace API
  version: 1.0.0
  description: API for autonomous AI-service generation and subscription management.
paths:
  /services:
    get:
      summary: List all AI services
      responses:
        '200':
          description: Successful response
  /billing/subscribe:
    post:
      summary: Create subscription
      responses:
        '201':
          description: Subscription created
  /services/generate:
    post:
      summary: Trigger AI service generation
      responses:
        '202':
          description: Generation initiated
