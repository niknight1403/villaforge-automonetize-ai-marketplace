# Prometheus alert rules for critical metrics
# These rules should be included in the Prometheus configuration via a ServiceMonitor or directly.
# CPU usage > 80% over 5 minutes
- alert: HighCPUUsage
  expr: sum(rate(container_cpu_usage_seconds_total{job="kubelet", image!=""}[5m])) by (pod) / sum(container_spec_cpu_quota{job="kubelet", image!=""}) by (pod) > 0.8
  for: 5m
  labels:
    severity: warning
  annotations:
    summary: "High CPU usage detected on pod {{ $labels.pod }}"
    description: "CPU usage has exceeded 80% for more than 5 minutes."

# Error rate > 5% over 5 minutes
- alert: HighErrorRate
  expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (pod) / sum(rate(http_requests_total[5m])) by (pod) > 0.05
  for: 5m
  labels:
    severity: critical
  annotations:
    summary: "High error rate detected on pod {{ $labels.pod }}"
    description: "Error rate has exceeded 5% for more than 5 minutes."
